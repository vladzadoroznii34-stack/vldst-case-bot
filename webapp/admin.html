"use strict";


/* =====================================================
   TELEGRAM WEBAPP
===================================================== */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor(
            "#08080f"
        );

        tg.setBackgroundColor(
            "#08080f"
        );

    } catch (e) {

        console.log(
            "Telegram UI settings unavailable"
        );
    }
}


/* =====================================================
   API
===================================================== */

const API =
    window.location.origin;


function getHeaders() {

    const result = {
        "Content-Type":
            "application/json"
    };

    if (
        tg &&
        tg.initData
    ) {

        result[
            "X-Telegram-Init-Data"
        ] = tg.initData;
    }

    return result;
}


/* =====================================================
   API REQUEST
===================================================== */

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            API + url,
            {
                ...options,
                headers: {
                    ...getHeaders(),
                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = {};

    if (text) {

        try {

            data =
                JSON.parse(text);

        } catch {

            data = {
                error: text
            };
        }
    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            `HTTP ${response.status}`
        );
    }


    return data;
}


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text == null
            ? ""
            : String(text);

    return div.innerHTML;
}


function showMessage(
    id,
    text,
    error = false
) {

    const element =
        document.getElementById(id);

    if (!element) {
        return;
    }

    element.textContent =
        text;

    element.classList.add(
        "show"
    );

    element.classList.toggle(
        "error",
        error
    );
}


function clearMessage(id) {

    const element =
        document.getElementById(id);

    if (!element) {
        return;
    }

    element.textContent =
        "";

    element.classList.remove(
        "show",
        "error"
    );
}


function setButtonLoading(
    id,
    loading,
    normalText
) {

    const button =
        document.getElementById(id);

    if (!button) {
        return;
    }

    button.disabled =
        loading;

    button.textContent =
        loading
            ? "⏳ Выполняется..."
            : normalText;
}


/* =====================================================
   ACCESS CHECK
===================================================== */

async function checkAdmin() {

    try {

        if (
            !tg ||
            !tg.initData
        ) {

            showDenied(
                "Telegram WebApp не передал данные пользователя."
            );

            return;
        }


        const data =
            await api(
                "/api/admin/check"
            );


        if (
            !data ||
            !data.admin
        ) {

            showDenied(
                "Telegram ID не имеет доступа к админ-панели."
            );

            return;
        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";

        document.getElementById(
            "denied"
        ).style.display =
            "none";

        document.getElementById(
            "panel"
        ).style.display =
            "block";


        await Promise.all([
            loadStats(),
            loadCases(),
            loadItems()
        ]);


        await fillCaseSelectors();

    } catch (error) {

        console.error(
            "ADMIN CHECK ERROR:",
            error
        );

        showDenied(
            "Ошибка проверки доступа: " +
            error.message
        );
    }
}


function showDenied(
    reason
) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";

    document.getElementById(
        "denied"
    ).style.display =
        "block";


    const paragraph =
        document.querySelector(
            "#denied p"
        );

    if (paragraph) {

        paragraph.textContent =
            reason ||
            "У тебя нет доступа к панели.";
    }
}


/* =====================================================
   STATS
===================================================== */

async function loadStats() {

    try {

        const data =
            await api(
                "/api/admin/stats"
            );


        document.getElementById(
            "users"
        ).textContent =
            data.users || 0;

        document.getElementById(
            "cases"
        ).textContent =
            data.cases || 0;

        document.getElementById(
            "items"
        ).textContent =
            data.items || 0;

        document.getElementById(
            "inventory"
        ).textContent =
            data.inventory || 0;


    } catch (error) {

        console.error(
            "STATS ERROR:",
            error
        );

        document.getElementById(
            "users"
        ).textContent =
            "—";

        document.getElementById(
            "cases"
        ).textContent =
            "—";

        document.getElementById(
            "items"
        ).textContent =
            "—";

        document.getElementById(
            "inventory"
        ).textContent =
            "—";
    }
}


/* =====================================================
   CREATE CASE
===================================================== */

async function createCase() {

    clearMessage(
        "caseMessage"
    );


    const name =
        document.getElementById(
            "caseName"
        ).value.trim();

    const description =
        document.getElementById(
            "caseDescription"
        ).value.trim();

    const coins =
        Number(
            document.getElementById(
                "caseCoins"
            ).value || 0
        );

    const stars =
        Number(
            document.getElementById(
                "caseStars"
            ).value || 0
        );

    const image =
        document.getElementById(
            "caseImage"
        ).value.trim();


    if (!name) {

        showMessage(
            "caseMessage",
            "❌ Введи название кейса.",
            true
        );

        return;
    }


    if (
        coins < 0 ||
        stars < 0
    ) {

        showMessage(
            "caseMessage",
            "❌ Цена не может быть отрицательной.",
            true
        );

        return;
    }


    const data = {

        name:
            name,

        description:
            description,

        price_coins:
            coins,

        price_stars:
            stars,

        image_url:
            image
    };


    setButtonLoading(
        "createCaseButton",
        true,
        "✨ Создать кейс"
    );


    try {

        await api(
            "/api/admin/cases",
            {
                method: "POST",
                body:
                    JSON.stringify(
                        data
                    )
            }
        );


        showMessage(
            "caseMessage",
            "✅ Кейс успешно создан!"
        );


        document.getElementById(
            "caseName"
        ).value = "";

        document.getElementById(
            "caseDescription"
        ).value = "";

        document.getElementById(
            "caseCoins"
        ).value = "";

        document.getElementById(
            "caseStars"
        ).value = "";

        document.getElementById(
            "caseImage"
        ).value = "";


        await loadCases();

        await loadStats();

        await fillCaseSelectors();


    } catch (error) {

        console.error(
            "CREATE CASE ERROR:",
            error
        );

        showMessage(
            "caseMessage",
            "❌ " + error.message,
            true
        );

    } finally {

        setButtonLoading(
            "createCaseButton",
            false,
            "✨ Создать кейс"
        );
    }
}


/* =====================================================
   LOAD CASES
===================================================== */

async function loadCases() {

    const list =
        document.getElementById(
            "caseList"
        );


    list.innerHTML =
        '<div class="item">⏳ Загрузка кейсов...</div>';


    try {

        const data =
            await api(
                "/api/admin/cases"
            );


        const cases =
            Array.isArray(
                data
            )
                ? data
                : (
                    Array.isArray(
                        data.cases
                    )
                        ? data.cases
                        : []
                );


        list.innerHTML =
            "";


        if (!cases.length) {

            list.innerHTML =
                '<div class="item">📦 Кейсов пока нет.</div>';

            await fillCaseSelectors();

            return;
        }


        cases.forEach(
            c => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "item";


                div.innerHTML = `

                    <div class="item-title">
                        🎁 ${escapeHtml(
                            c.name
                        )}
                    </div>

                    <div class="item-info">

                        ID:
                        ${c.id}

                        <br>

                        🪙
                        ${c.price_coins ?? 0}
                        Coins

                        ·

                        ⭐
                        ${c.price_stars ?? 0}
                        Stars

                        <br>

                        Статус:
                        ${
                            c.active
                                ? "🟢 активен"
                                : "🔴 выключен"
                        }

                    </div>

                    ${
                        c.active
                            ? `
                                <button
                                    class="danger"
                                    onclick="
                                        disableCase(
                                            ${Number(c.id)}
                                        )
                                    "
                                >
                                    🗑 Выключить кейс
                                </button>
                            `
                            : ""
                    }

                `;


                list.appendChild(
                    div
                );
            }
        );


        await fillCaseSelectors();


    } catch (error) {

        console.error(
            "LOAD CASES ERROR:",
            error
        );

        list.innerHTML = `
            <div class="error-box">
                ❌ Не удалось загрузить кейсы.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


/* =====================================================
   DISABLE CASE
===================================================== */

async function disableCase(
    id
) {

    if (
        !confirm(
            "Выключить этот кейс?"
        )
    ) {
        return;
    }


    try {

        await api(
            `/api/admin/cases/${id}/disable`,
            {
                method: "POST"
            }
        );


        alert(
            "✅ Кейс выключен."
        );


        await loadCases();

        await loadStats();

        await fillCaseSelectors();


    } catch (error) {

        console.error(
            "DISABLE CASE ERROR:",
            error
        );

        alert(
            "❌ " +
            error.message
        );
    }
}

    if (sellPrice < 0) {

        showMessage(

    try {

        const data =
            await api(

            );


        const items =
            Array.isArray(
                data
            )
                ? data
                : (
                    Array.isArray(
                        data.items
                    )
                        ? data.items
                        : []
                );


        list.innerHTML =
            "";


        if (!items.length) {

            list.innerHTML =
                '<div class="item">💎 Предметов пока нет.</div>';

            await fillItemSelector();

            return;
        }


        items.forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "item";


                div.innerHTML = `

                    <div class="item-title">
                        💎 ${escapeHtml(
                            item.name
                        )}

                    <div class="item-info">

                        ID:
                        ${item.id}

                        <br>

                        Редкость:
                        ${escapeHtml(
                            item.rarity ||
                            "COMMON"
                        )}

                        <br>

                        Продажа:
                        ${item.sell_price ?? 0}
                        Coins

                    </div>

                `;


                list.appendChild(

                );
            }
        );


        await fillItemSelector();


    } catch (error) {

        console.error(
            "LOAD ITEMS ERROR:",
            error

        list.innerHTML = `
            <div class="error-box">
                ❌ Не удалось загрузить предметы.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


/* =====================================================
   SELECT CASES
===================================================== */

async function fillCaseSelectors() {

    try {

        const data =
            await api(
                "/api/admin/cases"
            );


        const cases =
            Array.isArray(
                data
            )
                ? data
                : (
                    Array.isArray(
                        data.cases
                    )
                        ? data.cases
                        : []
                );


        const selectors = [

            document.getElementById(
                "dropCase"
            ),

            document.getElementById(
                "contentCase"
            )

        ];


        selectors.forEach(
            select => {

                if (!select) {
                    return;
                }


                select.innerHTML =
                    '<option value="">Выбери кейс</option>';


                cases
                    .filter(
                        c =>
                            c.active !== false
                    )
                    .forEach(
                        c => {

                            const option =
                                document.createElement(
                                    "option"
                                );

                            option.value =
                                c.id;

                            option.textContent =
                                `${c.name} (#${c.id})`;

                            select.appendChild(
                                option
                            );
                        }
                    );
            }
        );


    } catch (error) {

        console.error(
            "CASE SELECT ERROR:",
            error
        );
    }
}

/* =====================================================
   ADD ITEM TO CASE
===================================================== */

async function addDrop() {

    clearMessage(
        "dropMessage"
    );


    const caseId =
        document.getElementById(
            "dropCase"
        ).value;

    const itemId =
        document.getElementById(
            "dropItem"
        ).value;

    const chance =
        Number(
            document.getElementById(
                "dropChance"
            ).value
        );


    if (
        !caseId ||
        !itemId
    ) {

        showMessage(
            "dropMessage",
            "❌ Выбери кейс и предмет.",
            true
        );

        return;
    }


    if (
        !Number.isFinite(chance) ||
        chance <= 0 ||
        chance > 100
    ) {

        showMessage(
            "dropMessage",
            "❌ Шанс должен быть от 0.01 до 100%.",
            true
        );

        return;
    }


    const data = {

        case_id:
            Number(caseId),

        item_id:
            Number(itemId),

        drop_chance:
            chance
    };


    setButtonLoading(
        "addDropButton",
        true,
        "🎲 Добавить шанс"
    );


    try {

        await api(
            "/api/admin/case-items",
            {
                method: "POST",
                body:
                    JSON.stringify(
                        data
                    )
            }
        );


        showMessage(
            "dropMessage",
            "✅ Предмет добавлен в кейс!"
        );


        document.getElementById(
            "dropChance"
        ).value = "";


    } catch (error) {

        console.error(
            "ADD DROP ERROR:",
            error
        );

        showMessage(
            "dropMessage",
            "❌ " + error.message,
            true
        );

    } finally {

        setButtonLoading(
            "addDropButton",
            false,
            "🎲 Добавить шанс"
        );
    }
}


/* =====================================================
   CASE CONTENT
===================================================== */

async function loadCaseItems() {

    const caseId =
        document.getElementById(
            "contentCase"
        ).value;


    const list =
        document.getElementById(
            "caseItemsList"
        );


    if (!caseId) {

        list.innerHTML =
            '<div class="item">Выбери кейс выше.</div>';

        return;
    }


    list.innerHTML =
        '<div class="item">⏳ Загрузка содержимого...</div>';


    try {

        const data =
            await api(
                `/api/admin/cases/${caseId}/items`
            );


        const items =
            Array.isArray(
                data
            )
                ? data
                : (
                    Array.isArray(
                        data.items
                    )
                        ? data.items
                        : (
                            Array.isArray(
                                data.case_items
                            )
                                ? data.case_items
                                : []
                        )
                );


        list.innerHTML =
            "";


        if (!items.length) {

            list.innerHTML =
                '<div class="item">🎲 В этом кейсе пока нет предметов.</div>';

            return;
        }


        items.forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "item";


                const itemName =
                    item.item_name ||
                    item.name ||
                    (
                        item.item &&
                        item.item.name
                    ) ||
                    "Предмет";


                const chance =
                    item.drop_chance ??
                    item.chance ??
                    0;


                div.innerHTML = `

                    <div class="item-title">
                        💎 ${escapeHtml(
                            itemName
                        )}
                    </div>

                    <div class="item-info">

                        ID:
                        ${
                            item.item_id ??
                            item.id ??
                            "—"
                        }

                        <br>

                        🎯 Шанс:
                        ${chance}%

                    </div>

                `;


                list.appendChild(
                    div
                );
            }
        );


    } catch (error) {

        console.error(
            "CASE ITEMS ERROR:",
            error
        );

        list.innerHTML = `
            <div class="error-box">
                ❌ Не удалось загрузить содержимое кейса.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}
