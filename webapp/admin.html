<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VLDST ADMIN</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #241650, #090812 50%, #06060b);
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 760px;
            margin: auto;
            padding: 16px;
        }

        .header,
        .card {
            background: rgba(18, 17, 30, .94);
            border: 1px solid rgba(130, 100, 255, .2);
            border-radius: 20px;
        }

        .header {
            padding: 22px;
        }

        h1, h3 {
            margin-top: 0;
        }

        .subtitle {
            color: #9995a7;
            margin-top: 6px;
        }

        .card {
            margin-top: 15px;
            padding: 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat {
            padding: 13px;
            border-radius: 14px;
            background: rgba(255,255,255,.05);
        }

        .stat b {
            display: block;
            font-size: 21px;
        }

        .stat span {
            color: #9995a7;
            font-size: 11px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 9px;
            border-radius: 12px;
            border: 1px solid #302c45;
            background: #11101b;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #7048ff, #9c5cff);
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        button:active {
            transform: scale(.98);
        }

        .secondary {
            background: rgba(255,255,255,.08);
        }

        .danger {
            background: #8b2f4d;
        }

        .status,
        .result {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.05);
            color: #bbb6c7;
        }

        .item {
            padding: 13px;
            margin-top: 8px;
            border-radius: 13px;
            background: rgba(255,255,255,.04);
        }

        .item b {
            display: block;
            margin-bottom: 5px;
        }

        .muted {
            color: #9995a7;
            font-size: 13px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .section-title button {
            width: auto;
            margin: 0;
            padding: 9px 12px;
        }

        @media(max-width: 600px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⚙️ VLDST ADMIN</h1>

        <div class="subtitle">
            Панель управления VLDST CASE
        </div>

        <div class="status" id="status">
            Проверка доступа...
        </div>
    </div>


    <!-- =========================
         STATS
    ========================== -->

    <div class="card">

        <div class="section-title">
            <h3>📊 Статистика</h3>

            <button
                class="secondary"
                onclick="loadStats()"
            >
                🔄
            </button>
        </div>

        <div class="stats">

            <div class="stat">
                <b id="users">0</b>
                <span>Пользователи</span>
            </div>

            <div class="stat">
                <b id="casesCount">0</b>
                <span>Кейсы</span>
            </div>

            <div class="stat">
                <b id="itemsCount">0</b>
                <span>Предметы</span>
            </div>

            <div class="stat">
                <b id="inventoryCount">0</b>
                <span>Инвентарь</span>
            </div>

        </div>

    </div>


    <!-- =========================
         GIVE COINS
    ========================== -->

    <div class="card">

        <h3>🪙 Выдать Coins</h3>

        <input
            id="coinsTelegramId"
            type="number"
            placeholder="Telegram ID игрока"
        >

        <input
            id="coinsAmount"
            type="number"
            min="1"
            placeholder="Количество Coins"
        >

        <button onclick="giveCoins()">
            🪙 Выдать Coins
        </button>

    </div>


    <!-- =========================
         CREATE CASE
    ========================== -->

    <div class="card">

        <h3>🎁 Создать кейс</h3>

        <input
            id="caseName"
            placeholder="Название кейса"
        >

        <input
            id="caseDescription"
            placeholder="Описание"
        >

        <input
            id="caseCoins"
            type="number"
            min="0"
            value="100"
            placeholder="Цена Coins"
        >

        <input
            id="caseStars"
            type="number"
            min="0"
            value="0"
            placeholder="Цена Stars"
        >

        <input
            id="caseImage"
            placeholder="URL изображения"
        >

        <button onclick="createCase()">
            🎁 Создать кейс
        </button>

    </div>


    <!-- =========================
         CREATE ITEM
    ========================== -->

    <div class="card">

        <h3>💎 Создать предмет</h3>

        <input
            id="itemName"
            placeholder="Название предмета"
        >

        <input
            id="itemDescription"
            placeholder="Описание"
        >

        <select id="itemRarity">

            <option value="COMMON">COMMON</option>
            <option value="RARE">RARE</option>
            <option value="EPIC">EPIC</option>
            <option value="LEGENDARY">LEGENDARY</option>
            <option value="MYTHIC">MYTHIC</option>

        </select>

        <input
            id="itemPrice"
            type="number"
            min="0"
            value="50"
            placeholder="Цена продажи"
        >

        <input
            id="itemImage"
            placeholder="URL изображения"
        >

        <button onclick="createItem()">
            💎 Создать предмет
        </button>

    </div>


    <!-- =========================
         ADD ITEM TO CASE
    ========================== -->

    <div class="card">

        <h3>🎯 Добавить предмет в кейс</h3>

        <input
            id="caseId"
            type="number"
            placeholder="ID кейса"
        >

        <input
            id="itemId"
            type="number"
            placeholder="ID предмета"
        >

        <input
            id="dropChance"
            type="number"
            step="0.01"
            min="0.01"
            max="100"
            placeholder="Шанс выпадения %"
        >

        <button onclick="addItemToCase()">
            🎯 Добавить в кейс
        </button>

    </div>


    <!-- =========================
         CASES
    ========================== -->

    <div class="card">

        <div class="section-title">

            <h3>🎁 Кейсы</h3>

            <button
                class="secondary"
                onclick="loadCases()"
            >
                🔄
            </button>

        </div>

        <div id="casesList">
            Загрузка...
        </div>

    </div>


    <!-- =========================
         ITEMS
    ========================== -->

    <div class="card">

        <div class="section-title">

            <h3>💎 Предметы</h3>

            <button
                class="secondary"
                onclick="loadItems()"
            >
                🔄
            </button>

        </div>

        <div id="itemsList">
            Загрузка...
        </div>

    </div>


    <!-- =========================
         RESULT
    ========================== -->

    <div
        class="card result"
        id="result"
    >
        Готово к работе.
    </div>

</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {
    tg.ready();
    tg.expand();
}


const initData =
    tg && tg.initData
        ? tg.initData
        : "";


async function api(
    url,
    options = {}
) {

    options.headers = {

        ...(options.headers || {}),

        "X-Telegram-Init-Data":
            initData,

        "Content-Type":
            "application/json"
    };


    const response =
        await fetch(
            url,
            options
        );


    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error(
            "Сервер вернул неправильный ответ"
        );
    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Ошибка API"
        );
    }


    return data;
}


/* =========================
   RESULT
========================= */

function showResult(
    text,
    success = true
) {

    const result =
        document.getElementById(
            "result"
        );


    result.innerHTML =
        success
            ? "✅ " + text
            : "❌ " + text;
}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin() {

    try {

        await api(
            "/api/admin/check"
        );


        document
            .getElementById(
                "status"
            )
            .textContent =
            "✅ Доступ администратора подтверждён";


        await loadStats();
        await loadCases();
        await loadItems();


    } catch (error) {

        document
            .getElementById(
                "status"
            )
            .textContent =
            "⛔ " + error.message;

    }
}


/* =========================
   STATS
========================= */

async function loadStats() {

    try {

        const data =
            await api(
                "/api/admin/stats"
            );


        document
            .getElementById("users")
            .textContent =
            data.users;


        document
            .getElementById("casesCount")
            .textContent =
            data.cases;


        document
            .getElementById("itemsCount")
            .textContent =
            data.items;


        document
            .getElementById("inventoryCount")
            .textContent =
            data.inventory;

    } catch (error) {

        showResult(
            error.message,
            false
        );

    }
}


/* =========================
   GIVE COINS
========================= */

async function giveCoins() {

    const telegramId =
        Number(
            document
                .getElementById(
                    "coinsTelegramId"
                )
                .value
        );


    const amount =
        Number(
            document
                .getElementById(
                    "coinsAmount"
                )
                .value
        );


    if (!telegramId) {

        showResult(
            "Введите Telegram ID игрока",
            false
        );

        return;
    }


    if (!amount || amount <= 0) {

        showResult(
            "Введите количество Coins",
            false
        );

        return;
    }


    try {

        const data =
            await api(
                "/api/admin/give-coins",
                {

                    method: "POST",

                    body: JSON.stringify({

                        telegram_id:
                            telegramId,

                        amount:
                            amount

                    })

                }
            );


        showResult(
            "Выдано " +
            data.added +
            " Coins. Баланс игрока: " +
            data.coins
        );


        document
            .getElementById(
                "coinsAmount"
            )
            .value = "";


    } catch (error) {

        showResult(
            error.message,
            false
        );

    }
}


/* =========================
   CREATE CASE
========================= */

async function createCase() {

    try {

        const name =
            document
                .getElementById(
                    "caseName"
                )
                .value
                .trim();


        if (!name) {

            showResult(
                "Введите название кейса",
                false
            );

            return;
        }


        const data =
            await api(
                "/api/admin/cases",
                {

                    method: "POST",

                    body: JSON.stringify({

                        name:
                            name,

                        description:
                            document
                                .getElementById(
                                    "caseDescription"
                                )
                                .value
                                .trim(),

                        price_coins:
                            Number(
                                document
                                    .getElementById(
                                        "caseCoins"
                                    )
                                    .value
                            ),

                        price_stars:
                            Number(
                                document
                                    .getElementById(
                                        "caseStars"
                                    )
                                    .value
                            ),

                        image_url:
                            document
                                .getElementById(
                                    "caseImage"
                                )
                                .value
                                .trim()

                    })

                }
            );


        showResult(
            "Кейс создан. ID: " +
            data.case_id
        );


        await loadStats();
        await loadCases();


    } catch (error) {

        showResult(
            error.message,
            false
        );

    }
}


/* =========================
   CREATE ITEM
========================= */

async function createItem() {

    try {

        const name =
            document
                .getElementById(
                    "itemName"
                )
                .value
                .trim();


        if (!name) {

            showResult(
                "Введите название предмета",
                false
            );

            return;
        }


        const data =
            await api(
                "/api/admin/items",
                {

                    method: "POST",

                    body: JSON.stringify({

                        name:
                            name,

                        description:
                            document
                                .getElementById(
                                    "itemDescription"
                                )
                                .value
                                .trim(),

                        rarity:
                            document
                                .getElementById(
                                    "itemRarity"
                                )
                                .value,

                        sell_price:
                            Number(
                                document
                                    .getElementById(
                                        "itemPrice"
                                    )
                                    .value
                            ),

                        image_url:
                            document
                                .getElementById(
                                    "itemImage"
                                )
                                .value
                                .trim()

                    })

                }
            );


        showResult(
            "Предмет создан. ID: " +
            data.item_id
        );


        await loadStats();
        await loadItems();


    } catch (error) {

        showResult(
            error.message,
            false
        );

    }
}


/* =========================
   ADD ITEM TO CASE
========================= */

async function addItemToCase() {

    const caseId =
        Number(
            document
                .getElementById(
                    "caseId"
                )
                .value
        );


    const itemId =
        Number(
            document
                .getElementById(
                    "itemId"
                )
                .value
        );


    const chance =
        Number(
            document
                .getElementById(
                    "dropChance"
                )
                .value
        );


    if (!caseId) {

        showResult(
            "Введите ID кейса",
            false
        );

        return;
    }


    if (!itemId) {

        showResult(
            "Введите ID предмета",
            false
        );

        return;
    }


    if (!chance || chance <= 0) {

        showResult(
            "Введите шанс выпадения",
            false
        );

        return;
    }


    try {

        await api(
            "/api/admin/case-items",
            {

                method: "POST",

                body: JSON.stringify({

                    case_id:
                        caseId,

                    item_id:
                        itemId,

                    drop_chance:
                        chance

                })

            }
        );


        showResult(
            "Предмет добавлен в кейс"
        );


        await loadCases();


    } catch (error) {

        showResult(
            error.message,
            false
        );

    }
}


/* =========================
   LOAD CASES
========================= */

async function loadCases() {

    const container =
        document.getElementById(
            "casesList"
        );


    try {

        const data =
            await api(
                "/api/admin/cases"
            );


        if (
            !data.cases ||
            data.cases.length === 0
        ) {

            container.innerHTML =
                '<div class="muted">Кейсов пока нет.</div>';

            return;
        }


        container.innerHTML =
            data.cases
                .map(
                    item => `

                        <div class="item">

                            <b>
                                🎁 #${item.id}
                                — ${escapeHtml(item.name)}
                            </b>

                            <div class="muted">
                                Coins: ${item.price_coins}
                                · Stars: ${item.price_stars}
                            </div>

                            <div class="muted">
                                ${
                                    item.active
                                        ? "🟢 Активен"
                                        : "🔴 Выключен"
                                }
                            </div>

                            ${
                                item.active
                                    ? `
                                        <button
                                            class="danger"
                                            onclick="disableCase(${item.id})"
                                        >
                                            Выключить кейс
                                        </button>
                                      `
                                    : ""
                            }

                        </div>

                    `
                )
                .join("");


    } catch (error) {

        container.innerHTML =
            '<div class="muted">Ошибка загрузки.</div>';

    }
}


/* =========================
   LOAD ITEMS
========================= */

async function loadItems() {

    const container =
        document.getElementById(
            "itemsList"
        );


    try {

        const data =
            await api(
                "/api/admin/items"
            );


        if (
            !data.items ||
            data.items.length === 0
        ) {

            container.innerHTML =
                '<div class="muted">Предметов пока нет.</div>';

            return;
        }


        container.innerHTML =
            data.items
                .map(
                    item => `

                        <div class="item">

                            <b>
                                💎 #${item.id}
                                — ${escapeHtml(item.name)}
                            </b>

                            <div class="muted">
                                Редкость: ${escapeHtml(item.rarity)}
                            </div>

                            <div class="muted">
                                Продажа: ${item.sell_price} Coins
                            </div>

                        </div>

                    `
                )
                .join("");


    } catch (error) {

        container.innerHTML =
            '<div class="muted">Ошибка загрузки.</div>';

    }
}


/* =========================
   DISABLE CASE
========================= */

async function disableCase(
    caseId
) {

    if (
        !confirm(
            "Выключить этот кейс?"
        )
    ) {
        return;
    }


    try {

        await api(
            "/api/admin/cases/" +
            caseId +
            "/disable",
            {
                method: "POST"
            }
        );


        showResult(
            "Кейс выключен"
        );


        await loadCases();
        await loadStats();


    } catch (error) {

        showResult(
            error.message,
            false
        );

    }
}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
    </html>
