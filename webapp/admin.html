<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080912"><title>VLDST ADMIN</title><link rel="stylesheet" href="/webapp/style.css"></head><body><main class="app"><header class="topbar"><div class="brand"><span>VLDST</span> ADMIN</div><button class="ghost" style="padding:9px 12px" onclick="loadAll()">↻</button></header><div id="stats" class="service-grid"></div><section class="section"><div class="card"><h2>📢 Реклама / рассылка</h2><p class="muted">Сообщение уйдёт прямо пользователям в чат с ботом. Поддерживается Telegram HTML.</p><textarea id="broadcastText" placeholder="🔥 Новость VLDST CASE\n\nHTML: <b>жирный</b>, <i>курсив</i>"></textarea><button class="primary" onclick="broadcast()">ОТПРАВИТЬ В ЧАТЫ</button><div id="history" style="margin-top:10px"></div></div></section><section class="section"><div class="card"><h2>👤 Управление игроком</h2><input id="uid" placeholder="Telegram ID"><div class="modal-grid"><button class="primary" onclick="giveCoins()">+10K Coins</button><button class="primary" onclick="giveStars()">+100 Stars</button><button class="primary" onclick="premium()">Premium 30д</button><button class="primary" onclick="luck()">Luck 7д</button><button class="primary danger" onclick="ban(true)">БАН</button><button class="primary success" onclick="ban(false)">РАЗБАН</button><button class="ghost" onclick="resetUser()">СБРОС БАЛАНСА</button></div></div></section><section class="section"><div class="card"><h2>🎁 Кейсы</h2><div id="cases"></div></div></section><section class="section"><div class="card"><h2>⭐ Stars Store</h2><div id="products"></div></div></section><section class="section"><div class="card"><h2>🎯 Создать задание</h2><input id="taskTitle" placeholder="Название"><input id="taskDesc" placeholder="Описание"><div class="modal-grid"><input id="taskCoins" type="number" placeholder="Coins"><input id="taskStars" type="number" placeholder="Stars"></div><button class="primary" onclick="createTask()">СОЗДАТЬ ЗАДАНИЕ</button></div></section><section class="section"><div class="card"><h2>🎟 Создать промокод</h2><input id="promoCode" placeholder="VLDST-2026"><div class="modal-grid"><input id="promoCoins" type="number" placeholder="Coins"><input id="promoStars" type="number" placeholder="Stars"></div><input id="promoUses" type="number" placeholder="Количество использований"><button class="primary" onclick="createPromo()">СОЗДАТЬ ПРОМОКОД</button></div></section><section class="section"><div class="card"><div class="row"><h2>👥 Пользователи</h2><span class="muted">до 500</span></div><input id="search" oninput="renderUsers()" placeholder="ID / username / имя"><div id="users"></div></div></section></main><div id="toast" class="toast"></div><script src="/webapp/admin.js"></script></body></html>
