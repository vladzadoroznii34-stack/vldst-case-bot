<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VLDST ADMIN</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at top,
                    #241650,
                    #090812 50%,
                    #06060b
                );

            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 760px;
            margin: auto;
            padding: 18px;
        }

        .header {
            padding: 22px;
            border-radius: 22px;
            background: rgba(20, 18, 35, 0.9);
            border: 1px solid rgba(130, 100, 255, 0.25);
        }

        h1 {
            margin: 0;
        }

        .subtitle {
            margin-top: 6px;
            color: #9995a7;
        }

        .card {
            margin-top: 15px;
            padding: 18px;
            border-radius: 20px;
            background: rgba(18, 17, 30, 0.92);
            border: 1px solid rgba(130, 100, 255, 0.18);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .stat {
            padding: 12px;
            border-radius: 14px;
            background: rgba(255,255,255,0.05);
        }

        .stat b {
            display: block;
            font-size: 20px;
        }

        .stat span {
            color: #9995a7;
            font-size: 11px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 9px;
            border-radius: 12px;
            border: 1px solid #302c45;
            background: #11101b;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #7048ff,
                #9c5cff
            );
            color: white;
            font-weight: 800;
        }

        .status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #bbb6c7;
        }

        .item {
            padding: 12px;
            margin-top: 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
        }

        .danger {
            background: #8b2f4d;
        }

        @media(max-width:600px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            ⚙️ VLDST ADMIN
        </h1>

        <div class="subtitle">
            Панель управления проектом
        </div>

        <div
            class="status"
            id="status"
        >
            Проверка доступа...
        </div>

    </div>


    <!-- STATS -->

    <div class="card">

        <h3>
            📊 Статистика
        </h3>

        <div class="stats">

            <div class="stat">
                <b id="users">
                    0
                </b>
                <span>
                    Пользователи
                </span>
            </div>

            <div class="stat">
                <b id="casesCount">
                    0
                </b>
                <span>
                    Кейсы
                </span>
            </div>

            <div class="stat">
                <b id="itemsCount">
                    0
                </b>
                <span>
                    Предметы
                </span>
            </div>

            <div class="stat">
                <b id="inventoryCount">
                    0
                </b>
                <span>
                    Инвентарь
                </span>
            </div>

        </div>

    </div>


    <!-- CREATE CASE -->

    <div class="card">

        <h3>
            🎁 Создать кейс
        </h3>

        <input
            id="caseName"
            placeholder="Название кейса"
        >

        <input
            id="caseDescription"
            placeholder="Описание"
        >

        <input
            id="caseCoins"
            type="number"
            min="0"
            value="100"
            placeholder="Цена Coins"
        >

        <input
            id="caseStars"
            type="number"
            min="0"
            value="0"
            placeholder="Цена Stars"
        >

        <input
            id="caseImage"
            placeholder="URL изображения"
        >

        <button
            onclick="createCase()"
        >
            Создать кейс
        </button>

    </div>


    <!-- CREATE ITEM -->

    <div class="card">

        <h3>
            💎 Создать предмет
        </h3>

        <input
            id="itemName"
            placeholder="Название предмета"
        >

        <input
            id="itemDescription"
            placeholder="Описание"
        >

        <select
            id="itemRarity"
        >

            <option value="COMMON">
                COMMON
            </option>

            <option value="RARE">
                RARE
            </option>

            <option value="EPIC">
                EPIC
            </option>

            <option value="LEGENDARY">
                LEGENDARY
            </option>

            <option value="MYTHIC">
                MYTHIC
            </option>

        </select>

        <input
            id="itemPrice"
            type="number"
            min="0"
            value="50"
            placeholder="Цена продажи"
        >

        <input
            id="itemImage"
            placeholder="URL изображения"
        >

        <button
            onclick="createItem()"
        >
            Создать предмет
        </button>

    </div>


    <!-- ADD ITEM TO CASE -->

    <div class="card">

        <h3>
            🎯 Добавить предмет в кейс
        </h3>

        <input
            id="caseId"
            type="number"
            placeholder="ID кейса"
        >

        <input
            id="itemId"
            type="number"
            placeholder="ID предмета"
        >

        <input
            id="dropChance"
            type="number"
            step="0.01"
            min="0"
            max="100"
            placeholder="Шанс выпадения %"
        >

        <button
            onclick="addItemToCase()"
        >
            Добавить
        </button>

    </div>


    <!-- RESULT -->

    <div
        class="card"
        id="result"
    >

        Готово к работе.

    </div>

</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {

    tg.ready();

    tg.expand();

}


const initData =
    tg && tg.initData
        ? tg.initData
        : "";


async function api(
    url,
    options = {}
) {

    options.headers = {

        ...(options.headers || {}),

        "X-Telegram-Init-Data":
            initData,

        "Content-Type":
            "application/json"

    };


    const response =
        await fetch(
            url,
            options
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Ошибка API"
        );

    }


    return data;

}


async function checkAdmin() {

    try {

        await api(
            "/api/admin/check"
        );


        document
            .getElementById(
                "status"
            )
            .textContent =
            "✅ Доступ администратора подтверждён";


        await loadStats();


    } catch (error) {

        document
            .getElementById(
                "status"
            )
            .textContent =
            "⛔ " +
            error.message;

    }

}


async function loadStats() {

    const data =
        await api(
            "/api/admin/stats"
        );


    document
        .getElementById(
            "users"
        )
        .textContent =
        data.users;


    document
        .getElementById(
            "casesCount"
        )
        .textContent =
        data.cases;


    document
        .getElementById(
            "itemsCount"
        )
        .textContent =
        data.items;


    document
        .getElementById(
            "inventoryCount"
        )
        .textContent =
        data.inventory;

}


async function createCase() {

    const result =
        document.getElementById(
            "result"
        );


    try {

        const data =
            await api(
                "/api/admin/cases",
                {

                    method: "POST",

                    body: JSON.stringify({

                        name:
                            document
                                .getElementById(
                                    "caseName"
                                )
                                .value,

                        description:
                            document
                                .getElementById(
                                    "caseDescription"
                                )
                                .value,

                        price_coins:
                            Number(
                                document
                                    .getElementById(
                                        "caseCoins"
                                    )
                                    .value
                            ),

                        price_stars:
                            Number(
                                document
                                    .getElementById(
                                        "caseStars"
                                    )
                                    .value
                            ),

                        image_url:
                            document
                                .getElementById(
                                    "caseImage"
                                )
                                .value

                    })

                }
            );


        result.innerHTML =
            "✅ Кейс создан. ID: <b>" +
            data.case_id +
            "</b>";


        await loadStats();


    } catch (error) {

        result.textContent =
            "❌ " +
            error.message;

    }

}


async function createItem() {

    const result =
        document.getElementById(
            "result"
        );


    try {

        const data =
            await api(
                "/api/admin/items",
                {

                    method: "POST",

                    body: JSON.stringify({

                        name:
                            document
                                .getElementById(
                                    "itemName"
                                )
                                .value,

                        description:
                            document
                                .getElementById(
                                    "itemDescription"
                                )
                                .value,

                        rarity:
                            document
                                .getElementById(
                                    "itemRarity"
                                )
                                .value,

                        sell_price:
                            Number(
                                document
                                    .getElementById(
                                        "itemPrice"
                                    )
                                    .value
                            ),

                        image_url:
                            document
                                .getElementById(
                                    "itemImage"
                                )
                                .value

                    })

                }
            );


        result.innerHTML =
            "✅ Предмет создан. ID: <b>" +
            data.item_id +
            "</b>";


        await loadStats();


    } catch (error) {

        result.textContent =
            "❌ " +
            error.message;

    }

}


async function addItemToCase() {

    const result =
        document.getElementById(
            "result"
        );


    try {

        await api(
            "/api/admin/case-items",
            {

                method: "POST",

                body: JSON.stringify({

                    case_id:
                        Number(
                            document
                                .getElementById(
                                    "caseId"
                                )
                                .value
                        ),

                    item_id:
                        Number(
                            document
                                .getElementById(
                                    "itemId"
                                )
                                .value
                        ),

                    drop_chance:
                        Number(
                            document
                                .getElementById(
                                    "dropChance"
                                )
                                .value
                        )

                })

            }
        );


        result.textContent =
            "✅ Предмет добавлен в кейс";


    } catch (error) {

        result.textContent =
            "❌ " +
            error.message;

    }

}


checkAdmin();

</script>

</body>

    </html>
