<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLDST ADMIN</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:#07070d;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#11111b;border:1px solid #29293b;border-radius:20px;padding:16px}.btn,input,textarea{width:100%;box-sizing:border-box;margin-top:8px;border-radius:12px;padding:11px;border:1px solid #2c2c40;background:#171722;color:#fff}.btn{background:linear-gradient(135deg,#8b5cf6,#5b21b6);font-weight:800}.muted{color:#9292a6}.danger{background:#8b2635}.table{overflow:auto}.row{display:flex;gap:10px;padding:10px;border-bottom:1px solid #222235;min-width:650px}</style></head><body><div class="wrap"><div class="top"><h1>⚙️ VLDST ADMIN</h1><button class="btn" style="width:auto" onclick="load()">↻ Обновить</button></div><div id="stats" class="grid"></div><h2>📢 Реклама / рассылка</h2><div class="card"><textarea id="broadcast" rows="5" placeholder="HTML-текст сообщения"></textarea><button class="btn" onclick="broadcast()">Отправить всем</button></div><h2>👥 Пользователи</h2><div class="card table" id="users"></div><h2>🎁 Кейсы</h2><div class="grid" id="cases"></div></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const H=()=>tg?.initData?{"X-Telegram-Init-Data":tg.initData}:{};
async function req(u,o={}){o.headers={...(o.headers||{}),...H(),"Content-Type":"application/json"};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}
async function load(){try{let s=await req("/api/admin/stats");document.getElementById("stats").innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><h2>${typeof v==="number"?v.toLocaleString():v}</h2></div>`).join("");let u=await req("/api/admin/users");document.getElementById("users").innerHTML=u.users.map(x=>`<div class="row"><b>${x.first_name||""}</b><span>${x.telegram_id}</span><span>🪙 ${x.coins}</span><span>⭐ ${x.stars}</span><span>Lvl ${x.level}</span><button class="btn" onclick="ban(${x.telegram_id},${!x.banned})">${x.banned?"Разбан":"Бан"}</button></div>`).join("");let c=await req("/api/admin/cases");document.getElementById("cases").innerHTML=c.cases.map(x=>`<div class="card"><img src="${x.image_url}" style="width:100%;border-radius:15px"><h3>${x.name}</h3><p class="muted">🪙 ${x.price_coins} • ⭐ ${x.price_stars}</p><button class="btn" onclick="toggleCase(${x.id})">${x.active?"Выключить":"Включить"}</button></div>`).join("")}catch(e){alert(e.message)}}
async function ban(id,banned){await req("/api/admin/user/"+id+"/ban",{method:"POST",body:JSON.stringify({banned})});load()}
async function toggleCase(id){await req("/api/admin/cases/"+id+"/toggle",{method:"POST"});load()}
async function broadcast(){let text=document.getElementById("broadcast").value;if(!text)return;let d=await req("/api/admin/broadcast",{method:"POST",body:JSON.stringify({text})});alert(`Отправлено: ${d.sent}\\nОшибок: ${d.failed}`)}
load();
</script></body></html>
