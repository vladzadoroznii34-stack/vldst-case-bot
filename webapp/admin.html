<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLDST ADMIN</title><link rel="stylesheet" href="/webapp/style.css"></head><body><div class="glow"></div><main class="app"><header class="topbar"><div class="brand">VLDST <b>ADMIN</b></div><button class="iconbtn" onclick="loadAll()">↻</button></header><div id="stats" class="grid"></div><section class="section"><div class="card"><h3>📢 Рассылка / реклама</h3><textarea id="broadcastText" placeholder="HTML-текст..."></textarea><button class="primary" onclick="broadcast()">ОТПРАВИТЬ ВСЕМ</button></div></section><section class="section"><div class="card"><h3>👤 Пользователь</h3><input id="uid" placeholder="Telegram ID"><div class="grid"><button class="primary" onclick="giveCoins()">+10K Coins</button><button class="primary" onclick="giveStars()">+100 Stars</button></div><button class="primary" style="margin-top:8px" onclick="premium()">Premium 30 дней</button><div class="grid" style="margin-top:8px"><button class="primary danger" onclick="ban(true)">БАН</button><button class="primary success" onclick="ban(false)">РАЗБАН</button></div></div></section><section class="section"><div class="card"><h3>🎁 Кейсы</h3><div id="cases"></div></div></section><section class="section"><div class="card"><h3>👥 Пользователи</h3><input id="search" oninput="renderUsers()" placeholder="Поиск"><div id="users"></div></div></section></main><div id="toast" class="toast"></div><script src="/webapp/admin.js"></script></body></html>
