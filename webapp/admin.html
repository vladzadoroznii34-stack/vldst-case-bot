<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLDST ADMIN</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#08070d;color:#fff;font:15px Arial}.w{max-width:700px;margin:auto;padding:18px}.c{margin-top:14px;padding:18px;border-radius:18px;background:#151221;border:1px solid #30245a}input,select{width:100%;padding:12px;margin:5px 0;background:#0d0b14;color:#fff;border:1px solid #3b2e61;border-radius:9px}button{width:100%;padding:13px;margin-top:7px;border:0;border-radius:10px;background:linear-gradient(135deg,#7048ff,#a25cff);color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{padding:12px;background:#211a34;border-radius:12px}.s b{display:block;font-size:22px}.i{margin-top:8px;padding:10px;background:#0f0d17;border-radius:10px}</style></head><body><div class=w><h1>⚙️ VLDST ADMIN</h1><div id=status class=c>Проверка...</div><div class=c><h3>📊 Статистика</h3><div class=grid><div class=s><b id=u>0</b>Users</div><div class=s><b id=cases>0</b>Cases</div><div class=s><b id=items>0</b>Items</div><div class=s><b id=inv>0</b>Inventory</div></div></div><div class=c><h3>🪙 Выдать Coins</h3><input id=uid placeholder="Telegram ID"><input id=amt type=number placeholder="Coins"><button onclick=give()>ВЫДАТЬ</button></div><div class=c><h3>🎁 Создать кейс</h3><input id=cn placeholder="Название"><input id=cd placeholder="Описание"><input id=cp type=number placeholder="Цена Coins"><input id=cs type=number placeholder="Цена Stars"><input id=ci placeholder="URL картинки"><button onclick=newCase()>СОЗДАТЬ</button></div><div class=c><h3>💎 Создать предмет</h3><input id=in placeholder="Название"><input id=idc placeholder="Описание"><select id=rar><option>COMMON</option><option>RARE</option><option>EPIC</option><option>LEGENDARY</option><option>MYTHIC</option></select><input id=sp type=number placeholder="Цена продажи"><input id=ii placeholder="URL картинки"><button onclick=newItem()>СОЗДАТЬ</button></div><div class=c><h3>🔗 Добавить предмет в кейс</h3><input id=lc type=number placeholder="ID кейса"><input id=li type=number placeholder="ID предмета"><input id=ch type=number step=.01 placeholder="Шанс %"><button onclick=link()>ДОБАВИТЬ</button><p>VLDST // NEON: 60 / 25 / 10 / 4.5 / 0.5</p></div></div><script>const t=Telegram.WebApp;t.ready();t.expand();const init=t.initData;async function api(u,o={}){o.headers={...(o.headers||{}),"X-Telegram-Init-Data":init,"Content-Type":"application/json"};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}async function initApp(){try{await api("/api/admin/check");status.textContent="✅ Доступ разрешён";let d=await api("/api/admin/stats");u.textContent=d.users;cases.textContent=d.cases;items.textContent=d.items;inv.textContent=d.inventory}catch(e){status.textContent="⛔ "+e.message}}async function give(){await api("/api/admin/give-coins",{method:"POST",body:JSON.stringify({telegram_id:uid.value,amount:amt.value})});alert("Готово")}async function newCase(){let d=await api("/api/admin/cases",{method:"POST",body:JSON.stringify({name:cn.value,description:cd.value,price_coins:cp.value,price_stars:cs.value,image_url:ci.value})});alert("Кейс #"+d.case_id)}async function newItem(){let d=await api("/api/admin/items",{method:"POST",body:JSON.stringify({name:in.value,description:idc.value,rarity:rar.value,sell_price:sp.value,image_url:ii.value})});alert("Предмет #"+d.item_id)}async function link(){await api("/api/admin/case-items",{method:"POST",body:JSON.stringify({case_id:lc.value,item_id:li.value,drop_chance:ch.value})});alert("Добавлено")}initApp()</script></body></html>
