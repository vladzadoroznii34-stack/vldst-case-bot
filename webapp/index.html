<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VLDST CASE</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070d;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
:root{--p:#8b5cf6;--p2:#00d9ff;--card:#11111b;--muted:#9292a6}
.app{max-width:760px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}.logo b{color:var(--p)}
.wallet{display:flex;gap:8px}.pill{background:#12121c;border:1px solid #25253a;border-radius:16px;padding:9px 11px;font-size:13px}
.hero{background:linear-gradient(135deg,#151326,#0c1019);border:1px solid #282642;border-radius:28px;padding:20px;box-shadow:0 18px 60px #0008;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:30px}.hero p{color:var(--muted);margin:0 0 16px}.btn{border:0;border-radius:16px;padding:13px 16px;background:linear-gradient(135deg,var(--p),#5b21b6);color:white;font-weight:800;cursor:pointer}.btn.alt{background:#171722;border:1px solid #2a2a3d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,#14141f,#0e0e15);border:1px solid #252536;border-radius:22px;overflow:hidden}.card img{width:100%;display:block;aspect-ratio:1}.body{padding:13px}.name{font-weight:850}.muted{color:var(--muted);font-size:13px}.prices{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.price{background:#191925;border-radius:12px;padding:7px 9px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b12ee;backdrop-filter:blur(16px);border-top:1px solid #222235;display:flex;justify-content:center;z-index:5}.navin{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{background:none;border:0;color:#89899a;padding:11px 2px;font-size:11px}.nav button.active{color:#fff}.nav img{width:22px;height:22px;display:block;margin:auto auto 3px}.section{display:none}.section.active{display:block}.list{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;background:#11111b;border:1px solid #252536;border-radius:18px;padding:9px}.item img{width:66px;height:66px;border-radius:14px}.item .grow{flex:1}.rar{font-size:11px;font-weight:800}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:end;z-index:20}.modal.show{display:flex}.sheet{background:#101019;border-radius:28px 28px 0 0;width:100%;padding:18px;max-height:82vh;overflow:auto}.close{float:right;background:#20202d;border:0;color:#fff;border-radius:12px;padding:8px}.toast{position:fixed;left:14px;right:14px;bottom:82px;background:#171722;border:1px solid #303048;border-radius:16px;padding:12px;display:none;z-index:30}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<div class="app"><div class="top"><div class="logo">VLDST <b>CASE</b></div><div class="wallet"><span class="pill">🪙 <b id="coins">0</b></span><span class="pill">⭐ <b id="stars">0</b></span></div></div>
<div id="home" class="section active"><div class="hero"><h1 id="hello">Добро пожаловать</h1><p>Открывай кейсы, собирай редкие предметы и поднимайся в рейтинге.</p><button class="btn" onclick="go('cases')">Открыть кейсы →</button></div><div class="grid" id="featured"></div></div>
<div id="cases" class="section"><h2>🔥 Кейсы</h2><div class="grid" id="casesGrid"></div></div>
<div id="inventory" class="section"><h2>🎒 Инвентарь</h2><div class="list" id="inv"></div></div>
<div id="rating" class="section"><h2>🏆 Рейтинг</h2><div class="list" id="ratingList"></div></div>
<div id="shop" class="section"><h2>⭐ Магазин Stars</h2><p class="muted">Покупка Telegram Stars через официальный счёт Telegram.</p><div class="grid" id="shopGrid"></div></div>
<div id="profile" class="section"><div class="hero"><h2 id="profileName">Профиль</h2><p id="profileInfo"></p><button class="btn alt" onclick="copyRef()">🔗 Скопировать реферальную ссылку</button></div><div class="hero"><h3>🎮 Mini Game</h3><p class="muted">Нажми кнопку и попробуй удачу.</p><button class="btn" onclick="miniGame()">Крутить ×1</button><div id="gameResult" style="margin-top:12px;font-size:20px;font-weight:900"></div></div></div>
</div>
<div class="nav"><div class="navin">
<button onclick="go('home')" data-s="home" class="active"><img src="/webapp/assets/icons/home.svg">Главная</button>
<button onclick="go('cases')" data-s="cases"><img src="/webapp/assets/icons/cases.svg">Кейсы</button>
<button onclick="go('inventory')" data-s="inventory"><img src="/webapp/assets/icons/inventory.svg">Инвентарь</button>
<button onclick="go('rating')" data-s="rating"><img src="/webapp/assets/icons/rating.svg">Рейтинг</button>
<button onclick="go('shop')" data-s="shop"><img src="/webapp/assets/icons/shop.svg">Stars</button>
<button onclick="go('profile')" data-s="profile"><img src="/webapp/assets/icons/profile.svg">Профиль</button>
</div></div>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $=x=>document.getElementById(x), api="/api";
async function req(url,opt={}){const h=opt.headers||{};if(tg?.initData)h["X-Telegram-Init-Data"]=tg.initData;opt.headers=h;const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||"Ошибка");return d}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
function go(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.s===id));if(id==="cases")loadCases();if(id==="inventory")loadInv();if(id==="rating")loadRating();if(id==="shop")loadShop()}
async function loadMe(){try{const d=await req(api+"/me");$("coins").textContent=Number(d.coins).toLocaleString();$("stars").textContent=d.stars;$("hello").textContent=`Привет, ${d.first_name}!`;$("profileName").textContent=d.first_name;$("profileInfo").innerHTML=`🏆 Уровень: <b>${d.level}</b><br>⚡ XP: <b>${d.xp}</b><br>🪙 Coins: <b>${Number(d.coins).toLocaleString()}</b><br>⭐ Stars: <b>${d.stars}</b>`;window.me=d}catch(e){toast(e.message)}}
async function loadCases(){const d=await req(api+"/cases");$("casesGrid").innerHTML=d.cases.map(c=>`<div class="card"><img src="${c.image_url}"><div class="body"><div class="name">${c.name}</div><div class="muted">${c.description}</div><div class="prices"><span class="price">🪙 ${Number(c.price_coins).toLocaleString()}</span><span class="price">⭐ ${c.price_stars}</span></div><div style="display:flex;gap:7px;margin-top:10px"><button class="btn" style="flex:1" onclick="openCase(${c.id},'coins')">🪙 Открыть</button><button class="btn alt" onclick="openCase(${c.id},'stars')">⭐</button></div></div></div>`).join("");$("featured").innerHTML=d.cases.slice(0,3).map(c=>`<div class="card"><img src="${c.image_url}"><div class="body"><div class="name">${c.name}</div><div class="muted">⭐ ${c.price_stars} / 🪙 ${Number(c.price_coins).toLocaleString()}</div></div></div>`).join("")}
async function openCase(id,mode){try{if(mode==="stars"){const d=await req(api+"/stars/invoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"case",case_id:id})});tg?.openInvoice(d.invoice_url,(status)=>{if(status==="paid"){toast("🎉 Кейс оплачен!");loadMe();loadInv()}});return}const d=await req(api+`/cases/${id}/open`,{method:"POST"});$("modalContent").innerHTML=`<h2>🎉 Тебе выпал предмет!</h2><img style="width:100%;max-width:360px;border-radius:22px" src="${d.item.image_url}"><h2>${d.item.name}</h2><p class="muted">${d.item.rarity}</p><p>💰 Продажа: ${Number(d.item.sell_price).toLocaleString()} Coins</p><button class="btn" onclick="closeModal();loadMe()">Забрать</button>`;$("modal").classList.add("show");loadMe()}catch(e){toast(e.message)}}
function closeModal(){$("modal").classList.remove("show")}
async function loadInv(){const d=await req(api+"/inventory");$("inv").innerHTML=d.inventory.length?d.inventory.map(i=>`<div class="item"><img src="${i.image_url}"><div class="grow"><div class="name">${i.name}</div><div class="rar">${i.rarity}</div><div class="muted">💰 ${Number(i.sell_price).toLocaleString()} Coins</div></div><button class="btn alt" onclick="sell(${i.inventory_id})">Продать</button></div>`).join(""):"<div class='hero'><h3>Пока пусто</h3><p class='muted'>Открой кейс — предмет появится здесь.</p></div>"}
async function sell(id){try{const d=await req(api+`/inventory/${id}/sell`,{method:"POST"});toast(`Продано за ${Number(d.sold_for).toLocaleString()} Coins`);loadMe();loadInv()}catch(e){toast(e.message)}}
async function loadRating(){const d=await req(api+"/leaderboard");$("ratingList").innerHTML=d.leaderboard.map((x,i)=>`<div class="item"><div style="font-size:24px;width:36px;text-align:center">${i<3?["🥇","🥈","🥉"][i]:i+1}</div><div class="grow"><b>${x.first_name||x.username||"Игрок"}</b><div class="muted">Уровень ${x.level} • ${x.xp} XP</div></div><div>🪙 ${Number(x.coins).toLocaleString()}</div></div>`).join("")}
async function loadShop(){const d=await req(api+"/shop");$("shopGrid").innerHTML=d.products.map(p=>`<div class="card"><div class="body"><div style="font-size:36px">⭐</div><h3>${p.title}</h3><div class="muted">Зачисление на баланс VLDST</div><button class="btn" style="width:100%;margin-top:12px" onclick="buyStars('${p.id}')">Купить за ${p.charge} ⭐</button></div></div>`).join("")}
async function buyStars(id){try{const d=await req(api+"/stars/invoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"balance",product:id})});tg?.openInvoice(d.invoice_url,(s)=>{if(s==="paid"){toast("⭐ Stars зачислены");loadMe()}})}catch(e){toast(e.message)}}
async function copyRef(){try{const d=await req(api+"/referrals");await navigator.clipboard.writeText(d.referral_link);toast("🔗 Ссылка скопирована")}catch(e){toast(e.message)}}
function miniGame(){const r=Math.random();let s=r>.98?"💎 MYTHIC! +5000 XP":r>.85?"🔥 JACKPOT! +500 XP":r>.55?"✨ WIN +100 XP":"😈 Не повезло";$("gameResult").textContent=s}
loadMe();loadCases();
</script></body></html>
