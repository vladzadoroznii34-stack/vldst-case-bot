<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080912"><title>VLDST CASE</title><link rel="stylesheet" href="/webapp/style.css"></head><body>
<div class="bg-orb o1"></div><div class="bg-orb o2"></div><main class="app">
<header class="topbar"><div class="brand"><span>VLDST</span> CASE</div><div id="balance" class="balance">🪙 — &nbsp; ⭐ —</div></header>
<section class="hero"><div class="hero-tag">✦ PREMIUM DROP SYSTEM</div><h1>ОТКРЫВАЙ.<br><span>ПОЛУЧАЙ.</span></h1><p>Кейсы в игровом стиле, редкие предметы, Coins, Stars, Premium и настоящий рейтинг.</p><div class="hero-actions"><button class="primary" onclick="openCases()">🎁 ОТКРЫТЬ КЕЙС</button><button class="ghost" onclick="dailyBonus()">🎁 БОНУС</button></div><div class="hero-pills"><span>⚡ Быстрый дроп</span><span>🛡 Честные шансы</span><span>🏆 Рейтинг</span></div></section>
<section class="section"><div class="section-title"><h2>🔥 Кейсы</h2><button class="link" onclick="openCases()">Все →</button></div><div id="cases" class="case-scroll"></div></section>
<section class="section"><div class="section-title"><h2>⚡ Сервисы</h2></div><div class="service-grid"><button class="service-card" onclick="showShop()"><b>⭐</b><strong>Stars Store</strong><small>Premium • Boost • Coins</small></button><button class="service-card" onclick="showMini()"><b>🎮</b><strong>VLDST RUSH</strong><small>Мини-игра • награды</small></button><button class="service-card" onclick="showTasks()"><b>🎯</b><strong>Задания</strong><small>Забирай ежедневные награды</small></button><button class="service-card" onclick="showRef()"><b>👥</b><strong>Рефералы</strong><small>500 Coins за друга</small></button><button class="service-card" onclick="showRating()"><b>🏆</b><strong>Рейтинг</strong><small>Топ игроков VLDST</small></button><button class="service-card" onclick="showPromo()"><b>🎟</b><strong>Промокод</strong><small>Активируй бонус</small></button></div></section>
<section class="section"><div class="section-title"><h2>💎 Предметы</h2><span class="muted">49 предметов</span></div><div id="items" class="item-grid"></div></section>
<section class="section profile-card" onclick="showProfile()"><div class="avatar"><span id="avatarLetter">V</span></div><div class="profile-main"><b id="name">Игрок</b><div class="muted" id="level">Уровень 1 • 0 XP</div><div class="progress"><i id="xpbar"></i></div></div><div class="profile-arrow">›</div></section>
</main>
<nav class="nav"><button class="active" onclick="homeTop(this)">🏠<small>Главная</small></button><button onclick="openCases()">🎁<small>Кейсы</small></button><button onclick="showInventory()">🎒<small>Инвентарь</small></button><button onclick="showShop()">⭐<small>Магазин</small></button><button onclick="showProfile()">👤<small>Профиль</small></button></nav>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="sheet"></div></div></div><div id="toast" class="toast"></div><script src="/webapp/app.js"></script></body></html>
