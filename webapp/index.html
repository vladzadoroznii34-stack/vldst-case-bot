<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLDST</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="logo">
            <span>VLDST</span>
            <small>COLLECT • OPEN • DOMINATE</small>
        </div>

        <div class="balance">
            <div>🪙 <span id="coins">0</span></div>
            <div>⭐ <span id="stars">0</span></div>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero-glow"></div>

            <div class="case-card">
                <div class="case-label">FEATURED CASE</div>

                <div class="case-art">
                    <div class="case-symbol">V</div>
                    <div class="energy"></div>
                </div>

                <h1>VLDST // VOID</h1>

                <p>
                    Открой кейс и получи случайный предмет
                    из коллекции VLDST.
                </p>

                <button class="open-btn" onclick="openCase()">
                    🎁 ОТКРЫТЬ КЕЙС
                </button>

                <div class="price">
                    🪙 10 000
                </div>
            </div>
        </section>

        <section class="quick">

            <div class="quick-card">
                <span>🎁</span>
                <b>Ежедневный бонус</b>
                <small>Забрать награду</small>
            </div>

            <div class="quick-card">
                <span>🎯</span>
                <b>Задания</b>
                <small>3 задания доступны</small>
            </div>

        </section>

        <section class="section">

            <div class="section-title">
                <h2>🔥 Популярное</h2>
                <span>Смотреть всё →</span>
            </div>

            <div class="mini-cases">

                <div class="mini-case">
                    <div class="mini-art">V</div>
                    <b>CORE</b>
                    <small>5 000 🪙</small>
                </div>

                <div class="mini-case">
                    <div class="mini-art purple">V</div>
                    <b>AURA</b>
                    <small>15 000 🪙</small>
                </div>

                <div class="mini-case">
                    <div class="mini-art blue">V</div>
                    <b>PULSE</b>
                    <small>25 ⭐</small>
                </div>

            </div>

        </section>

    </main>

    <nav class="bottom-nav">

        <button class="active">
            <span>⌂</span>
            Главная
        </button>

        <button>
            <span>🎁</span>
            Кейсы
        </button>

        <button>
            <span>🎮</span>
            Игра
        </button>

        <button>
            <span>🎒</span>
            Инвентарь
        </button>

        <button>
            <span>👤</span>
            Профиль
        </button>

    </nav>

</div>

<div id="notification"></div>

<script src="app.js"></script>

</body>
  </html>
