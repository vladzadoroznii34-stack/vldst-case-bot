<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VLDST CASE</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #fff;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #392078 0%,
                    #120d25 35%,
                    #07070d 75%
                );
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 18px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 17px;

            border-radius: 18px;

            background: rgba(20, 18, 35, .85);

            border: 1px solid
                rgba(150, 110, 255, .2);
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .balance {
            padding: 9px 13px;

            border-radius: 12px;

            background: rgba(255,255,255,.06);

            font-weight: 800;
        }

        .hero {
            margin-top: 18px;
            padding: 25px 18px;

            text-align: center;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(100,65,180,.22),
                    rgba(20,18,35,.9)
                );

            border: 1px solid
                rgba(150,110,255,.25);

            box-shadow:
                0 20px 60px
                rgba(80,40,180,.12);
        }

        .case-title {
            font-size: 28px;
            font-weight: 900;
        }

        .case-subtitle {
            margin-top: 7px;
            color: #aaa4bb;
        }

        .case-image {
            width: 210px;
            height: 210px;

            margin: 25px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background:
                radial-gradient(
                    circle,
                    #6d39ff,
                    #24144f 55%,
                    #100b1d
                );

            box-shadow:
                0 0 55px
                rgba(125,70,255,.3);

            font-size: 70px;

            overflow: hidden;
        }

        .case-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        button {
            width: 100%;

            border: 0;
            border-radius: 15px;

            padding: 16px;

            color: white;

            font-size: 16px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #7048ff,
                    #a25cff
                );

            box-shadow:
                0 8px 30px
                rgba(112,72,255,.25);

            cursor: pointer;

            transition:
                transform .15s,
                opacity .15s;
        }

        button:active {
            transform: scale(.97);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        .section {
            margin-top: 18px;

            padding: 18px;

            border-radius: 20px;

            background:
                rgba(18,17,30,.9);

            border: 1px solid
                rgba(130,100,255,.16);
        }

        .section h3 {
            margin-top: 0;
        }

        .items {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }

        .item {
            padding: 13px;

            border-radius: 15px;

            background:
                rgba(255,255,255,.045);

            border: 1px solid
                rgba(255,255,255,.05);
        }

        .item-name {
            font-weight: 800;
        }

        .item-rarity {
            margin-top: 5px;

            color: #aaa4bb;

            font-size: 12px;
        }

        .chance {
            margin-top: 8px;

            font-weight: 900;
        }

        .result {
            display: none;

            margin-top: 18px;

            padding: 22px;

            text-align: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(103,60,190,.3),
                    rgba(20,18,35,.95)
                );

            border: 1px solid
                rgba(160,120,255,.3);

            animation: appear .4s ease;
        }

        .result.show {
            display: block;
        }

        .win-label {
            color: #aaa4bb;
            font-size: 13px;
        }

        .win-name {
            margin-top: 8px;

            font-size: 25px;
            font-weight: 900;
        }

        .win-rarity {
            margin-top: 6px;

            font-weight: 800;
        }

        .error {
            margin-top: 12px;

            padding: 12px;

            display: none;

            border-radius: 12px;

            background:
                rgba(160,40,70,.2);

            color: #ff8fa8;

            text-align: center;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: scale(.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @media(max-width:430px) {

            .items {
                grid-template-columns: 1fr;
            }

            .case-image {
                width: 180px;
                height: 180px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- TOP -->

    <div class="top">

        <div class="logo">
            VLDST
        </div>

        <div class="balance">
            🪙
            <span id="coins">
                0
            </span>
        </div>

    </div>


    <!-- CASE -->

    <div class="hero">

        <div class="case-title">
            VLDST // NEON
        </div>

        <div class="case-subtitle">
            Открой кейс и получи случайный предмет
        </div>


        <div class="case-image">

            🎁

        </div>


        <div class="price">
            🪙 1000 Coins
        </div>


        <button
            id="openButton"
            onclick="openCase()"
        >
            🎁 ОТКРЫТЬ КЕЙС
        </button>


        <div
            id="error"
            class="error"
        ></div>

    </div>


    <!-- RESULT -->

    <div
        id="result"
        class="result"
    >

        <div class="win-label">
            🎉 ТЕБЕ ВЫПАЛО
        </div>

        <div
            id="winName"
            class="win-name"
        >
        </div>

        <div
            id="winRarity"
            class="win-rarity"
        >
        </div>

    </div>


    <!-- ITEMS -->

    <div class="section">

        <h3>
            💎 Предметы кейса
        </h3>


        <div class="items">


            <div class="item">

                <div class="item-name">
                    #1 VLDST Neon Tag
                </div>

                <div class="item-rarity">
                    COMMON
                </div>

                <div class="chance">
                    60%
                </div>

            </div>


            <div class="item">

                <div class="item-name">
                    #2 VLDST Pulse
                </div>

                <div class="item-rarity">
                    RARE
                </div>

                <div class="chance">
                    25%
                </div>

            </div>


            <div class="item">

                <div class="item-name">
                    #3 VLDST Cyber Core
                </div>

                <div class="item-rarity">
                    EPIC
                </div>

                <div class="chance">
                    10%
                </div>

            </div>


            <div class="item">

                <div class="item-name">
                    #4 VLDST Phantom
                </div>

                <div class="item-rarity">
                    LEGENDARY
                </div>

                <div class="chance">
                    4.5%
                </div>

            </div>


            <div class="item">

                <div class="item-name">
                    #5 VLDST Void Crown
                </div>

                <div class="item-rarity">
                    MYTHIC
                </div>

                <div class="chance">
                    0.5%
                </div>

            </div>


        </div>

    </div>


</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

}


const initData =
    tg && tg.initData
        ? tg.initData
        : "";


async function api(
    url,
    options = {}
) {

    options.headers = {

        ...(options.headers || {}),

        "X-Telegram-Init-Data":
            initData,

        "Content-Type":
            "application/json"

    };


    const response =
        await fetch(
            url,
            options
        );


    let data;

    try {

        data =
            await response.json();

    } catch {

        throw new Error(
            "Сервер вернул некорректный ответ"
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Ошибка сервера"
        );

    }


    return data;

}


function showError(message) {

    const error =
        document.getElementById(
            "error"
        );

    error.textContent =
        message;

    error.style.display =
        "block";

}


function hideError() {

    document
        .getElementById(
            "error"
        )
        .style.display =
        "none";

}


function translateError(error) {

    const errors = {

        unauthorized:
            "Не удалось подтвердить Telegram-пользователя.",

        user_not_found:
            "Пользователь не найден. Перезапусти бота через /start.",

        case_not_found:
            "Кейс не найден или отключён.",

        case_has_no_items:
            "В этом кейсе пока нет предметов.",

        invalid_drop_chances:
            "У кейса неправильно настроены шансы.",

        not_enough_coins:
            "Недостаточно Coins для открытия."

    };


    return errors[error] ||
        error ||
        "Неизвестная ошибка";

}


async function loadUser() {

    try {

        const data =
            await api(
                "/api/user"
            );


        document
            .getElementById(
                "coins"
            )
            .textContent =
            Number(
                data.coins
            ).toLocaleString(
                "ru-RU"
            );

    } catch (error) {

        showError(
            translateError(
                error.message
            )
        );

    }

}


async function openCase() {

    const button =
        document.getElementById(
            "openButton"
        );


    hideError();


    button.disabled =
        true;

    button.textContent =
        "🎲 ОТКРЫВАЕМ...";


    try {

        const data =
            await api(
                "/api/cases/1/open",
                {
                    method: "POST"
                }
            );


        document
            .getElementById(
                "coins"
            )
            .textContent =
            Number(
                data.coins
            ).toLocaleString(
                "ru-RU"
            );


        document
            .getElementById(
                "winName"
            )
            .textContent =
            data.item.name;


        document
            .getElementById(
                "winRarity"
            )
            .textContent =
            "💎 " +
            data.item.rarity;


        document
            .getElementById(
                "result"
            )
            .classList.add(
                "show"
            );


        if (tg) {

            try {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );

            } catch {}

        }


        button.textContent =
            "🎁 ОТКРЫТЬ ЕЩЁ РАЗ";


    } catch (error) {

        showError(
            translateError(
                error.message
            )
        );


        button.textContent =
            "🎁 ОТКРЫТЬ КЕЙС";

    }


    button.disabled =
        false;

}


loadUser();

</script>

</body>

    </html>
