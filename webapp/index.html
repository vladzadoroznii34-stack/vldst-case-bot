<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080811">
  <meta name="color-scheme" content="dark">
  <title>VLDST CASE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/webapp/style.css">
</head>
<body>
<div class="glow"></div>

<main class="app">
  <header class="topbar">
    <div class="brand">VLDST <b>CASE</b></div>
    <div class="balance" id="balance">🪙 — &nbsp; ⭐ —</div>
  </header>

  <section class="hero">
    <span class="premium-tag" id="premium">FREE</span>
    <h1>ОТКРЫВАЙ.<br><span>ПОЛУЧАЙ.</span></h1>
    <p>Премиальные кейсы, редкие предметы, рейтинг, задания и награды — всё в одном приложении.</p>
    <button class="primary" onclick="openCases(this)">🎁 ОТКРЫТЬ КЕЙС</button>
  </section>

  <section class="section" id="casesSection">
    <div class="section-title">
      <h2>🔥 Кейсы</h2>
      <span class="muted" id="caseCount">Загрузка...</span>
    </div>
    <div id="cases" class="case-grid"></div>
  </section>

  <section class="section">
    <div class="section-title"><h2>⚡ Возможности</h2></div>
    <div class="grid">
      <button class="card feature" onclick="showShop()">⭐<h3>Магазин Stars</h3><span class="muted">Premium + бусты</span></button>
      <button class="card feature" onclick="showMini()">🎮<h3>Мини-игра</h3><span class="muted">Coins за игру</span></button>
      <button class="card feature" onclick="showRef()">👥<h3>Рефералы</h3><span class="muted">500 Coins за друга</span></button>
      <button class="card feature" onclick="showTasks()">🎯<h3>Задания</h3><span class="muted">Награды + daily</span></button>
      <button class="card feature" onclick="showBoosts()">⚡<h3>Бусты</h3><span class="muted">Активные усиления</span></button>
      <button class="card feature" onclick="showLeaderboard()">🏆<h3>Рейтинг</h3><span class="muted">Топ игроков</span></button>
    </div>
  </section>

  <section class="section">
    <button class="card feature daily-card" onclick="claimDaily()">
      <span class="daily-icon">🎁</span>
      <div><h3>Ежедневная награда</h3><span class="muted">Получить 1 000 Coins</span></div>
      <span class="daily-action">ЗАБРАТЬ</span>
    </button>
  </section>

  <section class="section">
    <div class="section-title">
      <h2>🎒 Предметы</h2>
      <span class="muted" id="itemCount">—</span>
    </div>
    <div id="items" class="item-grid"></div>
  </section>

  <section class="section">
    <button class="card profile profile-btn" onclick="showProfile()">
      <div class="avatar">V</div>
      <div class="profile-main">
        <b id="name">Игрок</b>
        <div class="muted" id="level">Уровень 1</div>
        <div class="progress"><i id="xpbar"></i></div>
      </div>
      <span class="chevron">›</span>
    </button>
  </section>
</main>

<nav class="nav">
  <button class="active" onclick="goHome(this)">🏠<small>Главная</small></button>
  <button onclick="openCases(this)">🎁<small>Кейсы</small></button>
  <button onclick="showInventory()">🎒<small>Инвентарь</small></button>
  <button onclick="showShop()">⭐<small>Магазин</small></button>
  <button onclick="showProfile()">👤<small>Профиль</small></button>
</nav>

<div id="modal" class="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">✕</button>
    <div id="sheet"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/webapp/assets.js"></script>
<script src="/webapp/app.js"></script>
</body>
</html>
