<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>VLDST CASE</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at top,
                    #21154a 0%,
                    #0b0915 45%,
                    #07070c 100%
                );
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: auto;
            padding: 18px;
        }

        .header {
            padding: 22px;
            border-radius: 24px;
            background: rgba(20, 18, 35, 0.85);
            border: 1px solid rgba(130, 100, 255, 0.25);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
        }

        .subtitle {
            margin-top: 7px;
            color: #9995ad;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .stat {
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
        }

        .stat-title {
            margin-top: 5px;
            color: #8f8a9f;
            font-size: 12px;
        }

        .section-title {
            margin: 25px 3px 12px;
            font-size: 20px;
            font-weight: 800;
        }

        .cases {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .case {
            overflow: hidden;
            padding: 14px;
            border-radius: 22px;
            background: rgba(18, 17, 30, 0.9);
            border: 1px solid rgba(130, 100, 255, 0.18);
        }

        .case-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            background: #171522;
        }

        .case-name {
            margin-top: 12px;
            font-size: 17px;
            font-weight: 800;
        }

        .case-description {
            margin-top: 6px;
            min-height: 34px;
            color: #9995a7;
            font-size: 12px;
        }

        .price {
            margin-top: 12px;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                #7048ff,
                #9b5cff
            );
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 18px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #bcb7ca;
            text-align: center;
            font-size: 14px;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 30px 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            color: #9995a7;
            text-align: center;
        }

        @media (max-width: 520px) {
            .cases {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .case-image {
                height: 180px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            🌌 VLDST
        </div>

        <div class="subtitle">
            Открывай кейсы, собирай предметы и поднимайся в рейтинге.
        </div>

        <div class="stats">

            <div class="stat">
                <div
                    class="stat-value"
                    id="coins"
                >
                    0
                </div>

                <div class="stat-title">
                    🪙 Coins
                </div>
            </div>

            <div class="stat">
                <div
                    class="stat-value"
                    id="stars"
                >
                    0
                </div>

                <div class="stat-title">
                    ⭐ Stars
                </div>
            </div>

            <div class="stat">
                <div
                    class="stat-value"
                    id="level"
                >
                    1
                </div>

                <div class="stat-title">
                    ⚡ Level
                </div>
            </div>

        </div>

    </div>

    <div class="section-title">
        🎁 Кейсы
    </div>

    <div
        class="cases"
        id="cases"
    ></div>

    <div
        class="message"
        id="message"
    >
        Загрузка VLDST...
    </div>

</div>

<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}

const initData =
    tg && tg.initData
        ? tg.initData
        : "";

async function api(
    url,
    options = {}
) {

    options.headers = {
        ...(options.headers || {}),

        "X-Telegram-Init-Data":
            initData,

        "Content-Type":
            "application/json"
    };

    const response =
        await fetch(
            url,
            options
        );

    const data =
        await response.json();

    if (!response.ok) {
        throw new Error(
            data.error ||
            "Произошла ошибка"
        );
    }

    return data;
}

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function (char) {

                const map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return map[char];
            }
        );
}

async function loadUser() {

    const user =
        await api(
            "/api/user"
        );

    document
        .getElementById("coins")
        .textContent =
        Number(user.coins)
            .toLocaleString();

    document
        .getElementById("stars")
        .textContent =
        user.stars;

    document
        .getElementById("level")
        .textContent =
        user.level;
}

async function loadCases() {

    const data =
        await api(
            "/api/cases"
        );

    const container =
        document.getElementById(
            "cases"
        );

    if (
        !data.cases ||
        data.cases.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                🎁 Кейсов пока нет.<br>
                Добавь их через админ-панель.
            </div>
        `;

        return;
    }

    container.innerHTML =
        data.cases
            .map(
                function (item) {

                    const image =
                        item.image_url
                            ? `
                                <img
                                    class="case-image"
                                    src="${escapeHtml(item.image_url)}"
                                    onerror="this.style.display='none'"
                                >
                            `
                            : "";

                    return `
                        <div class="case">

                            ${image}

                            <div class="case-name">
                                ${escapeHtml(item.name)}
                            </div>

                            <div class="case-description">
                                ${escapeHtml(
                                    item.description ||
                                    "Открой кейс и получи случайный предмет."
                                )}
                            </div>

                            <div class="price">
                                🪙 ${Number(
                                    item.price_coins || 0
                                ).toLocaleString()}
                                ${
                                    item.price_stars > 0
                                    ? ` • ⭐ ${item.price_stars}`
                                    : ""
                                }
                            </div>

                            <button
                                onclick="openCase(${item.id})"
                            >
                                🎁 Открыть
                            </button>

                        </div>
                    `;
                }
            )
            .join("");
}

async function openCase(
    caseId
) {

    const message =
        document.getElementById(
            "message"
        );

    try {

        message.textContent =
            "🎁 Открываем кейс...";

        const result =
            await api(
                `/api/cases/${caseId}/open`,
                {
                    method: "POST"
                }
            );

        document
            .getElementById("coins")
            .textContent =
            Number(
                result.coins
            ).toLocaleString();

        message.innerHTML =
            `
                🎉 Выпало:
                <b>${escapeHtml(
                    result.item.name
                )}</b>
                <br>
                Редкость:
                ${escapeHtml(
                    result.item.rarity
                )}
            `;

        if (tg) {
            tg.HapticFeedback
                ?.notification(
                    "success"
                );
        }

    } catch (error) {

        message.textContent =
            "❌ " +
            error.message;

        if (tg) {
            tg.HapticFeedback
                ?.notification(
                    "error"
                );
        }
    }
}

async function start() {

    try {

        await loadUser();

        await loadCases();

        document
            .getElementById(
                "message"
            )
            .textContent =
            "VLDST готов к работе 🚀";

    } catch (error) {

        document
            .getElementById(
                "message"
            )
            .textContent =
            "❌ " +
            error.message;
    }
}

start();

</script>

</body>
    </html>
