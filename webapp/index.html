<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>VLDST CASE</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #25253d 0%, #0d0d16 45%, #07070b 100%);
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 520px;
            margin: auto;
            padding: 20px 16px 40px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-top: 15px;
        }

        .subtitle {
            text-align: center;
            color: #85859b;
            margin-top: 6px;
        }

        .profile {
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .profile-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            padding: 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
        }

        .stat-title {
            color: #85859b;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 5px;
            font-size: 19px;
            font-weight: bold;
        }

        .section-title {
            margin: 28px 0 12px;
            font-size: 21px;
            font-weight: bold;
        }

        .case {
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 18px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .case-name {
            font-size: 19px;
            font-weight: bold;
        }

        .case-description {
            margin-top: 6px;
            color: #9090a3;
            font-size: 14px;
        }

        .case-price {
            margin-top: 14px;
            color: #ffd84d;
            font-weight: bold;
        }

        .open-button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: 0;
            border-radius: 13px;
            background: #ffffff;
            color: #09090d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .open-button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 20px;
            text-align: center;
            color: #77778a;
            font-size: 13px;
        }

        .error {
            color: #ff6868;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">VLDST</div>
    <div class="subtitle">CASE</div>

    <div class="profile">
        <div class="profile-name" id="username">
            Загрузка...
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-title">🪙 Coins</div>
                <div class="stat-value" id="coins">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">⭐ Stars</div>
                <div class="stat-value" id="stars">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">🏆 Уровень</div>
                <div class="stat-value" id="level">1</div>
            </div>

            <div class="stat">
                <div class="stat-title">⚡ XP</div>
                <div class="stat-value" id="xp">0</div>
            </div>

        </div>
    </div>

    <div class="section-title">
        🎁 Кейсы
    </div>

    <div id="cases">
        <div class="status">
            Загрузка кейсов...
        </div>
    </div>

    <div id="status" class="status"></div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const API = window.location.origin;

    function setStatus(text, error = false) {
        const element = document.getElementById("status");

        element.textContent = text;

        element.className = error
            ? "status error"
            : "status";
    }

    async function api(url, options = {}) {

        const headers = {
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": tg.initData || ""
        };

        const response = await fetch(API + url, {
            ...options,
            headers: {
                ...headers,
                ...(options.headers || {})
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Ошибка сервера"
            );
        }

        return data;
    }


    async function loadUser() {

        try {

            const user = await api("/api/user");

            document.getElementById("username").textContent =
                user.first_name ||
                user.username ||
                "Игрок";

            document.getElementById("coins").textContent =
                user.coins || 0;

            document.getElementById("stars").textContent =
                user.stars || 0;

            document.getElementById("level").textContent =
                user.level || 1;

            document.getElementById("xp").textContent =
                user.xp || 0;

        } catch (error) {

            console.error(error);

            document.getElementById("username").textContent =
                "Игрок";

            setStatus(
                "Не удалось загрузить профиль",
                true
            );
        }
    }


    async function loadCases() {

        const container =
            document.getElementById("cases");

        try {

            const cases = await api("/api/cases");

            container.innerHTML = "";

            if (!cases.length) {

                container.innerHTML = `
                    <div class="status">
                        Пока нет доступных кейсов
                    </div>
                `;

                return;
            }

            cases.forEach(item => {

                const div =
                    document.createElement("div");

                div.className = "case";

                div.innerHTML = `
                    <div class="case-name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="case-description">
                        ${escapeHtml(item.description || "")}
                    </div>

                    <div class="case-price">
                        🪙 ${item.price_coins || 0}
                    </div>

                    <button
                        class="open-button"
                        onclick="openCase(${item.id})"
                    >
                        🎁 Открыть
                    </button>
                `;

                container.appendChild(div);
            });

        } catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="status error">
                    Не удалось загрузить кейсы
                </div>
            `;
        }
    }


    async function openCase(caseId) {

        setStatus("Открываем кейс...");

        try {

            const result = await api(
                `/api/cases/${caseId}/open`,
                {
                    method: "POST",
                    body: JSON.stringify({
                        currency: "coins"
                    })
                }
            );

            const item = result.item;

            tg.showAlert(
                "🎉 Вы получили: " + item.name
            );

            await loadUser();

            setStatus(
                "🎉 Предмет получен!"
            );

        } catch (error) {

            console.error(error);

            tg.showAlert(
                error.message
            );

            setStatus(
                error.message,
                true
            );
        }
    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    async function start() {

        await loadUser();
        await loadCases();

    }

    start();

</script>

</body>
</html>
